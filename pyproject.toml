[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logwatch"
version = "0.1.0"
description = "Find signs of attacks in SSH, web server and firewall logs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
logwatch = "logwatch.__main__:main"

[tool.setuptools]
packages = ["logwatch"]
